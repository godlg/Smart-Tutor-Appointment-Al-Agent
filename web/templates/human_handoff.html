<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人工接管队列 - 家教智能预约</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 28px; }
        .header-links a {
            color: white; text-decoration: none;
            margin-left: 16px; padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
        }
        .filter-bar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar select, .filter-bar button {
            padding: 10px 16px;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
        }
        .filter-bar button {
            background: #4facfe;
            color: white;
            border: none;
            cursor: pointer;
        }
        .filter-bar button:hover { background: #2f9dea; }
        .count-hint { color: #718096; font-size: 13px; margin-left: auto; }
        .table-wrap {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead th {
            text-align: left;
            padding: 14px 16px;
            background: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            border-bottom: 1px solid #edf2f7;
            white-space: nowrap;
        }
        tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f3f7;
            color: #2d3748;
            vertical-align: middle;
        }
        tr.handoff-row { cursor: pointer; }
        tr.handoff-row:hover { background: #f8fbff; }
        .mono { font-family: Consolas, Monaco, monospace; font-size: 13px; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-pending { background: #fef3e2; color: #c05621; }
        .badge-resolved { background: #e6fffa; color: #2c7a7b; }
        .trigger-tag {
            display: inline-block;
            background: #e6f3ff;
            color: #2c5282;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            cursor: pointer;
            margin-right: 6px;
            color: white;
        }
        .btn-claim { background: #4299e1; }
        .btn-reply { background: #38b2ac; }
        .btn-resolve { background: #48bb78; }
        .btn:hover { opacity: 0.88; }
        .detail-row > td {
            background: #fafcff;
            padding: 0;
        }
        .detail-inner { padding: 16px; }
        .reply-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .reply-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
        }
        .reply-box button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #38b2ac;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .messages { display: flex; flex-direction: column; gap: 10px; }
        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg-parent {
            align-self: flex-start;
            background: #edf2f7;
            color: #2d3748;
        }
        .msg-agent {
            align-self: flex-end;
            background: #4facfe;
            color: white;
        }
        .msg-other {
            align-self: center;
            background: #f7fafc;
            color: #a0aec0;
            font-size: 13px;
        }
        .msg-meta {
            display: block;
            font-size: 11px;
            opacity: 0.75;
            margin-top: 4px;
        }
        .empty-hint {
            padding: 40px;
            text-align: center;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧑‍💼 人工接管队列</h1>
        <div class="header-links">
            <a href="/">💬 智能助手</a>
            <a href="/parent-center">🏠 家长中心</a>
        </div>
    </div>

    <div class="filter-bar">
        <label>状态：</label>
        <select id="status-filter" onchange="loadHandoffs()">
            <option value="pending" selected>待处理</option>
            <option value="resolved">已处理</option>
            <option value="">全部</option>
        </select>
        <button onclick="loadHandoffs()">刷新</button>
        <span class="count-hint" id="count-hint"></span>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>会话 ID</th>
                    <th>触发类型</th>
                    <th>无关轮数</th>
                    <th>创建时间</th>
                    <th>处理人 / 备注</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="handoff-body"></tbody>
        </table>
        <div class="empty-hint" id="empty-hint" style="display:none;">暂无记录</div>
    </div>

<script>
    const TRIGGER_TYPE_LABELS = {
        kickback_threshold: '踢回阈值',
        keyword: '关键词触发',
        manual: '客服手动',
    };
    const STATUS_LABELS = { pending: '待处理', resolved: '已处理' };

    function triggerLabel(type) {
        return TRIGGER_TYPE_LABELS[type] || type || '-';
    }
    function statusLabel(status) {
        return STATUS_LABELS[status] || status || '-';
    }
    function formatTime(value) {
        if (!value) return '-';
        return String(value).replace('T', ' ').replace(/\.\d+/, '').replace(/Z$/, '');
    }
    function cell(text, className) {
        const td = document.createElement('td');
        td.textContent = text === null || text === undefined ? '' : String(text);
        if (className) td.className = className;
        return td;
    }
    function badge(text, className) {
        const span = document.createElement('span');
        span.className = 'badge ' + className;
        span.textContent = text;
        return span;
    }
    function actionButton(label, className, handler) {
        const btn = document.createElement('button');
        btn.className = 'btn ' + className;
        btn.textContent = label;
        btn.addEventListener('click', function (event) {
            event.stopPropagation();
            handler(event);
        });
        return btn;
    }
    async function apiPost(path, payload) {
        const resp = await fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        let body = null;
        try { body = await resp.json(); } catch (e) { body = null; }
        return { ok: resp.ok, status: resp.status, body: body };
    }

    async function loadHandoffs() {
        const status = document.getElementById('status-filter').value;
        const url = status
            ? '/api/handoffs?status=' + encodeURIComponent(status)
            : '/api/handoffs';
        const body = document.getElementById('handoff-body');
        const empty = document.getElementById('empty-hint');
        try {
            const resp = await fetch(url);
            const payload = await resp.json();
            const records = (payload && payload.data) || [];
            renderHandoffs(records);
        } catch (e) {
            body.replaceChildren();
            empty.style.display = 'block';
            empty.textContent = '加载失败：' + e.message;
            document.getElementById('count-hint').textContent = '';
        }
    }

    function renderHandoffs(records) {
        const body = document.getElementById('handoff-body');
        const empty = document.getElementById('empty-hint');
        body.replaceChildren();
        document.getElementById('count-hint').textContent = '共 ' + records.length + ' 条';
        if (!records.length) {
            empty.style.display = 'block';
            empty.textContent = '暂无记录';
            return;
        }
        empty.style.display = 'none';
        records.forEach(function (record) {
            body.appendChild(buildRow(record));
            body.appendChild(buildDetailRow(record));
        });
    }

    function buildRow(record) {
        const tr = document.createElement('tr');
        tr.className = 'handoff-row';
        tr.dataset.id = record.id;

        tr.appendChild(cell(record.id, 'mono'));
        tr.appendChild(cell(record.session_id, 'mono'));
        tr.appendChild(cell(triggerLabel(record.trigger_type)));
        tr.appendChild(cell(record.unrelated_count === null || record.unrelated_count === undefined ? 0 : record.unrelated_count));

        const created = document.createElement('td');
        created.textContent = formatTime(record.created_at);
        tr.appendChild(created);

        const handled = document.createElement('td');
        const handledBy = record.handled_by || '';
        const note = record.resolve_note || '';
        if (handledBy || note) {
            handled.textContent = handledBy + (note ? (' · ' + note) : '');
        } else {
            handled.textContent = '-';
        }
        tr.appendChild(handled);

        const statusTd = document.createElement('td');
        statusTd.appendChild(badge(
            statusLabel(record.status),
            record.status === 'resolved' ? 'badge-resolved' : 'badge-pending'
        ));
        tr.appendChild(statusTd);

        const actions = document.createElement('td');
        if (record.status === 'pending') {
            actions.appendChild(actionButton('认领', 'btn-claim', function () { claimHandoff(record); }));
            actions.appendChild(actionButton('回复', 'btn-reply', function () { focusReply(record.id); }));
            actions.appendChild(actionButton('标记已处理', 'btn-resolve', function () { resolveHandoff(record); }));
        } else {
            actions.textContent = '-';
        }
        tr.appendChild(actions);

        tr.addEventListener('click', function () { toggleDetail(record.id); });
        return tr;
    }

    function buildDetailRow(record) {
        const tr = document.createElement('tr');
        tr.className = 'detail-row';
        tr.dataset.detailId = record.id;
        tr.style.display = 'none';

        const td = document.createElement('td');
        td.colSpan = 8;

        const inner = document.createElement('div');
        inner.className = 'detail-inner';

        if (record.status === 'pending') {
            const replyBox = document.createElement('div');
            replyBox.className = 'reply-box';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'reply-input';
            input.placeholder = '输入要回复家长的内容…';
            const send = document.createElement('button');
            send.textContent = '发送回复';
            send.addEventListener('click', function (event) {
                event.stopPropagation();
                sendReply(record.id, input);
            });
            input.addEventListener('click', function (event) { event.stopPropagation(); });
            input.addEventListener('keydown', function (event) {
                if (event.key === 'Enter') { sendReply(record.id, input); }
            });
            replyBox.appendChild(input);
            replyBox.appendChild(send);
            inner.appendChild(replyBox);
        }

        const messages = document.createElement('div');
        messages.className = 'messages';
        messages.dataset.messagesId = record.id;
        messages.textContent = '加载中…';
        inner.appendChild(messages);

        td.appendChild(inner);
        tr.appendChild(td);
        return tr;
    }

    function detailRowOf(id) {
        return document.querySelector('.detail-row[data-detail-id="' + id + '"]');
    }

    async function toggleDetail(id) {
        const detail = detailRowOf(id);
        if (!detail) return;
        if (detail.style.display === 'none') {
            detail.style.display = '';
            await loadMessages(id);
        } else {
            detail.style.display = 'none';
        }
    }

    function focusReply(id) {
        const detail = detailRowOf(id);
        if (!detail) return;
        detail.style.display = '';
        loadMessages(id);
        const input = detail.querySelector('.reply-input');
        if (input) input.focus();
    }

    async function loadMessages(id) {
        const box = document.querySelector('.messages[data-messages-id="' + id + '"]');
        if (!box) return;
        try {
            const resp = await fetch('/api/handoffs/' + id + '/messages');
            const payload = await resp.json();
            const messages = (payload && payload.data) || [];
            renderMessages(box, messages);
        } catch (e) {
            box.replaceChildren();
            const hint = document.createElement('div');
            hint.className = 'msg msg-other';
            hint.textContent = '会话加载失败：' + e.message;
            box.appendChild(hint);
        }
    }

    function renderMessages(box, messages) {
        box.replaceChildren();
        if (!messages.length) {
            const hint = document.createElement('div');
            hint.className = 'msg msg-other';
            hint.textContent = '暂无对话记录';
            box.appendChild(hint);
            return;
        }
        messages.forEach(function (message) {
            const div = document.createElement('div');
            if (message.role === 'parent') {
                div.className = 'msg msg-parent';
            } else if (message.role === 'agent') {
                div.className = 'msg msg-agent';
            } else {
                div.className = 'msg msg-other';
            }
            const text = document.createElement('span');
            text.textContent = message.content || '';
            div.appendChild(text);
            const meta = document.createElement('span');
            meta.className = 'msg-meta';
            meta.textContent = (message.role || 'unknown') + ' · ' + formatTime(message.created_at);
            div.appendChild(meta);
            box.appendChild(div);
        });
    }

    async function claimHandoff(record) {
        const name = window.prompt('请输入认领此工单的客服姓名：', '');
        if (!name) return;
        const result = await apiPost('/api/handoffs/' + record.id + '/claim', { agent_id: name });
        if (!result.ok) {
            window.alert('认领失败（' + result.status + '）');
            return;
        }
        loadHandoffs();
    }

    async function sendReply(id, input) {
        const content = (input.value || '').trim();
        if (!content) {
            window.alert('请输入回复内容');
            return;
        }
        let agentId = '';
        const row = document.querySelector('.handoff-row[data-id="' + id + '"]');
        if (row) {
            const handledCell = row.children[5];
            if (handledCell && handledCell.textContent && handledCell.textContent !== '-') {
                agentId = handledCell.textContent.split(' · ')[0];
            }
        }
        if (!agentId) {
            agentId = window.prompt('请输入客服姓名：', '') || '';
        }
        if (!agentId) return;
        const result = await apiPost('/api/handoffs/' + id + '/reply', {
            agent_id: agentId,
            content: content,
        });
        if (!result.ok) {
            window.alert('回复失败（' + result.status + '）');
            return;
        }
        input.value = '';
        loadMessages(id);
    }

    async function resolveHandoff(record) {
        const handledBy = window.prompt('处理人（可留空）：', '') || null;
        const note = window.prompt('处理备注（可留空）：', '') || null;
        const result = await apiPost('/api/handoffs/' + record.id + '/resolve', {
            handled_by: handledBy,
            note: note,
        });
        if (!result.ok) {
            window.alert('标记失败（' + result.status + '）');
            return;
        }
        loadHandoffs();
    }

    document.addEventListener('DOMContentLoaded', loadHandoffs);
</script>
</body>
</html>
