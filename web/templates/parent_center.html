<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家长中心 - 家教智能预约</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #2d3748;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 32px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .header-links a {
            color: white; text-decoration: none;
            margin: 0 12px; padding: 6px 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px; font-size: 14px;
        }
        .container { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: #2d3748;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 12px;
        }
        .card-icon.blue { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }
        .card-icon.pink { background: linear-gradient(135deg, #fa709a, #fee140); color: white; }
        .card-icon.green { background: linear-gradient(135deg, #43e97b, #38f9d7); color: white; }
        .card-icon.purple { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .card-icon.orange { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .card-icon.red { background: linear-gradient(135deg, #ff9a9e, #fecfef); color: white; }
        .card h3 { font-size: 18px; margin-bottom: 6px; }
        .card p { color: #718096; font-size: 14px; line-height: 1.5; }

        .alert-bar {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-bar.show { display: block; }
        .alert-bar a {
            color: white;
            text-decoration: underline;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏠 家长中心</h1>
        <p>一站式查看孩子的学习情况，管理课程套餐</p>
        <div class="header-links" style="margin-top:16px;">
            <a href="/">💬 智能助手</a>
        </div>
    </div>

    <div class="container">
        <div class="alert-bar" id="renewal-alert"></div>

        <div class="card-grid">
            <a href="/teachers" class="card">
                <div class="card-icon blue">👨‍🏫</div>
                <h3>老师库</h3>
                <p>查看所有老师，学科 / 年级筛选，找到最适合孩子的老师</p>
            </a>

            <a href="/packages" class="card">
                <div class="card-icon pink">📦</div>
                <h3>课时套餐</h3>
                <p>选择长期套餐，享受优惠价格，一次性排好周固定课时</p>
            </a>

            <a href="/schedule-calendar" class="card">
                <div class="card-icon green">📅</div>
                <h3>排课日历</h3>
                <p>查看所有已排课程，一键添加「周固定时段」，冲突自动检测</p>
            </a>

            <a href="/lesson-series" class="card">
                <div class="card-icon purple">📚</div>
                <h3>我的系列课</h3>
                <p>查看进行中的系列课、剩余课时、调课 / 退课</p>
            </a>

            <a href="/progress-dashboard" class="card">
                <div class="card-icon orange">📈</div>
                <h3>学习进度</h3>
                <p>每次课后的小结、作业、薄弱点一目了然</p>
            </a>

            <a href="/student-profile" class="card">
                <div class="card-icon red">👦</div>
                <h3>学生档案</h3>
                <p>孩子的学科薄弱点、学习目标、偏好老师风格</p>
            </a>
        </div>
    </div>

    <script>
        async function loadAlerts() {
            // 简化：从 lesson-service 看下是否有即将结束的套餐
            try {
                const res = await fetch('/api/lesson-series/');
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    // 找剩余课时 ≤ 3 的系列
                    const urgent = data.data.find(s =>
                        (s.total_lessons - (s.completed_lessons || 0) - (s.cancelled_lessons || 0)) <= 3
                    );
                    if (urgent) {
                        const remain = urgent.total_lessons - (urgent.completed_lessons || 0) - (urgent.cancelled_lessons || 0);
                        const alertEl = document.getElementById('renewal-alert');
                        alertEl.classList.add('show');
                        alertEl.innerHTML =
                            `⏰ <strong>续费提醒</strong>：系列课 #${urgent.id} 仅剩 ${remain} 课时。<a href="/packages">查看续费套餐 →</a>`;
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        loadAlerts();
    </script>
</body>
</html>
